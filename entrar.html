<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020a05">
<title>Creative Dark Legends 2 COPA CDL</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020a05;color:#f4fff6;font-family:Arial,Helvetica,sans-serif}body{min-height:100vh;padding:22px 14px 44px}.wrap{max-width:720px;margin:0 auto}.card{background:#0d2416;border:1px solid #31583d;border-radius:22px;padding:22px}.tag{display:inline-block;background:#73ff2d;color:#062000;padding:7px 16px;border-radius:999px;font-weight:900}.brand h1{font-size:38px;line-height:1.05;margin:14px 0 8px}.sub{color:#c7d5ca}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 16px}.tab,.btn{border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:900}.tab{background:#06140b;color:#d7e6da;border:1px solid #31583d}.tab.active,.green{background:#73ff2d;color:#062000}.yellow{background:#ffe447;color:#211c00}.dark{background:#18261d;color:#fff;border:1px solid #3c5544}.hidden{display:none!important}p{font-size:17px;line-height:1.45}input{width:100%;border:2px solid #31583d;background:#021007;color:white;border-radius:14px;padding:15px;font-size:18px;outline:none}.full{width:100%}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.row .btn{flex:1}.msg{min-height:26px;margin-top:14px;font-weight:800;color:#ffe447}.ok{color:#73ff2d}.ticket{background:#06140b;border:1px solid #31583d;border-radius:16px;padding:18px;text-align:center;margin:14px 0}.ticketNo{font-size:36px;letter-spacing:4px;font-weight:1000;color:#ffe447}.small{font-size:13px;color:#b8c9bb}@media(max-width:520px){.tabs{grid-template-columns:1fr}.brand h1{font-size:33px}.card{padding:18px}}
</style>
</head>
<body>
<main class="wrap"><section id="login" class="card">
<div class="brand"><span class="tag">MINECRAFT</span><h1>Creative Dark Legends 2<br>COPA CDL</h1><div class="sub">Acesso oficial CS2</div></div>
<div class="tabs"><button id="tabEmail" class="tab active" onclick="show('email')">📧 Receber código</button><button id="tabTicket" class="tab" onclick="show('ticket')">🎟️ Entrar por Ticket</button></div>
<div id="emailPane"><p>Digite seu e-mail para receber o código de acesso.</p><input id="email" type="email" autocomplete="email" placeholder="voce@email.com"><button id="sendBtn" class="btn green" style="margin-top:12px" onclick="sendCode()">Enviar código</button></div>
<div id="codePane" class="hidden"><p>Código enviado para <b id="codeEmail"></b></p><input id="code" inputmode="numeric" maxlength="8" autocomplete="one-time-code" placeholder="00000000"><div class="row"><button id="verifyBtn" class="btn green" onclick="verifyCode()">Verificar</button><button class="btn dark" onclick="sendCode(true)">Reenviar</button><button class="btn dark" onclick="show('email')">Trocar e-mail</button></div></div>
<div id="ticketPane" class="hidden"><p>Gere um ticket para pedir autorização ao administrador.</p><button id="ticketBtn" class="btn yellow full" onclick="requestTicket()">🎟️ Gerar Ticket e Pedir ao ADM</button></div>
<div id="waitingPane" class="hidden"><p>Solicitação enviada ao administrador.</p><div class="ticket"><div class="small">SEU TICKET É</div><div id="ticketNo" class="ticketNo">0000000</div><div id="ticketStatus">⏳ Aguardando ADM.</div></div><div class="row"><button class="btn dark" onclick="checkTicket(true)">Atualizar</button><button id="notifyBtn" class="btn yellow" onclick="notifyAgain()">📧 Avisar ADM novamente</button></div></div>
<div id="msg" class="msg"></div>
</section></main>
<script>
const BASE='https://yivgtvgyaalhlcxatbfc.supabase.co',KEY='sb_publishable_JSNYdrq-FFHQtZ0DO3sfVw_v93KOBjs',STORE='sb-yivgtvgyaalhlcxatbfc-auth-token',GUEST='cs_guest_ticket_v1';
let pendingEmail='',guest=null,poll=null;const $=id=>document.getElementById(id);
function message(t,ok=false){$('msg').textContent=t||'';$('msg').className='msg'+(ok?' ok':'')}
function show(name){if(poll){clearInterval(poll);poll=null}['emailPane','codePane','ticketPane','waitingPane'].forEach(id=>$(id).classList.add('hidden'));$('tabEmail').classList.toggle('active',name==='email'||name==='code');$('tabTicket').classList.toggle('active',name==='ticket'||name==='waiting');$(name+'Pane').classList.remove('hidden');message('')}
async function edge(payload,token=''){const h={'Content-Type':'application/json','apikey':KEY};if(token)h.Authorization='Bearer '+token;const r=await fetch(BASE+'/functions/v1/send-cs-otp',{method:'POST',headers:h,body:JSON.stringify(payload)});const data=await r.json().catch(()=>({}));return {ok:r.ok,data}}
async function auth(path,payload){const r=await fetch(BASE+'/auth/v1/'+path,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(payload)});const data=await r.json().catch(()=>({}));return {ok:r.ok,data}}
async function allowed(token){const r=await fetch(BASE+'/rest/v1/rpc/is_cs_authorized',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+token},body:'{}'});return r.ok&&(await r.json())===true}
function saveSession(s){if(!s?.access_token)return;localStorage.setItem(STORE,JSON.stringify({...s,expires_at:s.expires_at||Math.floor(Date.now()/1000)+Number(s.expires_in||3600)}))}
function go(){location.href='./creative-squad-v8/?v=31&t='+Date.now()}
async function sendCode(resend=false){const email=(resend?pendingEmail:$('email').value.trim()).toLowerCase();if(!email||!email.includes('@'))return message('Digite um e-mail válido.');pendingEmail=email;$('sendBtn').disabled=true;message('Verificando autorização...');try{const chk=await edge({action:'request_access',email});if(!chk.ok)return message(chk.data?.error||'Não foi possível verificar o acesso.');if(chk.data?.authorized!==true&&chk.data?.status!=='approved'){message(chk.data?.ticket?'Seu pedido foi criado. Ticket '+chk.data.ticket+'.':'Este e-mail ainda não está autorizado. Use a aba Ticket.');return}message('Enviando código...');const r=await auth('otp',{email,create_user:true});if(!r.ok)return message(r.data?.msg||r.data?.error_description||r.data?.message||'Não foi possível enviar o código.');$('codeEmail').textContent=email;$('code').value='';show('code');message('✅ Código enviado. Confira caixa de entrada e spam.',true)}catch(e){message('Falha de conexão. Tente novamente.')}finally{$('sendBtn').disabled=false}}
async function verifyCode(){const token=$('code').value.trim();if(token.length<6)return message('Digite o código recebido.');$('verifyBtn').disabled=true;message('Verificando código...');try{const r=await auth('verify',{email:pendingEmail,token,type:'email'});if(!r.ok||!r.data?.access_token)return message(r.data?.msg||r.data?.error_description||'Código inválido ou expirado.');if(!(await allowed(r.data.access_token)))return message('Este e-mail ainda não está autorizado pelo ADM.');saveSession(r.data);message('✅ Verificado. Entrando...',true);setTimeout(go,400)}catch(e){message('Não foi possível verificar agora.')}finally{$('verifyBtn').disabled=false}}
async function requestTicket(){if(guest)return waiting();$('ticketBtn').disabled=true;message('Gerando ticket...');try{const r=await edge({action:'guest_request'});if(!r.ok)return message(r.data?.error||'Não foi possível gerar o ticket.');guest={ticket:Number(r.data.ticket),request_key:String(r.data.request_key)};localStorage.setItem(GUEST,JSON.stringify(guest));waiting();$('ticketStatus').textContent=r.data?.email_alert_sent?'📧 ADM avisado. Aguardando autorização...':'🔔 Solicitação criada. Aguardando ADM.'}catch(e){message('Falha ao gerar ticket.')}finally{$('ticketBtn').disabled=false}}
function waiting(){show('waiting');$('ticketNo').textContent=String(guest.ticket);$('ticketStatus').textContent='⏳ Aguardando ADM.';poll=setInterval(()=>checkTicket(false),4000)}
async function checkTicket(manual=false){if(!guest)return;if(manual)$('ticketStatus').textContent='Atualizando...';try{const r=await edge({action:'guest_status',ticket:guest.ticket,request_key:guest.request_key});if(!r.ok){if(manual)$('ticketStatus').textContent=r.data?.error||'Falha ao atualizar.';return}if(r.data.status==='approved'){if(poll)clearInterval(poll);$('ticketStatus').textContent='✅ Autorizado! Entrando...';const login=await auth('token?grant_type=password',{email:r.data.guest_email,password:r.data.guest_password});if(!login.ok||!login.data?.access_token){$('ticketStatus').textContent='Autorizado, mas não foi possível entrar. Toque em Atualizar.';return}if(!(await allowed(login.data.access_token))){$('ticketStatus').textContent='Aguardando liberação final do ADM...';return}saveSession(login.data);localStorage.removeItem(GUEST);guest=null;setTimeout(go,350)}else if(r.data.status==='denied'){$('ticketStatus').textContent='❌ O ADM não autorizou esta entrada.';localStorage.removeItem(GUEST);guest=null}else if(manual)$('ticketStatus').textContent='⏳ Aguardando ADM.'}catch(e){if(manual)$('ticketStatus').textContent='Falha ao atualizar.'}}
async function notifyAgain(){if(!guest)return;$('notifyBtn').disabled=true;try{const r=await edge({action:'guest_notify_admin',ticket:guest.ticket,request_key:guest.request_key});$('ticketStatus').textContent=r.ok?(r.data?.email_alert_sent?'✅ Novo aviso enviado ao ADM.':'🔔 Aviso enviado no site.'):(r.data?.error||'Não foi possível avisar o ADM.')}finally{setTimeout(()=>$('notifyBtn').disabled=false,1500)}}
try{guest=JSON.parse(localStorage.getItem(GUEST)||'null')}catch{guest=null}
show(guest?'waiting':'email');if(guest)waiting();
</script>
</body></html>
